<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ИЗМЕНИТЬ: заголовок вкладки браузера -->
<title>Лучший главный бухгалтер — Народный выбор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #faf7f2;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(140, 40, 60, 0.08) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(200, 160, 100, 0.10) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 0%, rgba(140, 40, 60, 0.05) 0%, transparent 35%);
    min-height: 100vh;
    color: #2a2420;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Тонкая диагональная штриховка поверх */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(140, 40, 60, 0.025) 0px,
      rgba(140, 40, 60, 0.025) 1px,
      transparent 1px,
      transparent 9px
    );
    pointer-events: none;
    z-index: -1;
  }

  /* Флаг России — компактный в левом углу */
  .flag {
    position: fixed;
    left: 10px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    width: 18px;
    height: 26px;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    opacity: 0.7;
    z-index: 100;
  }
  .flag div { flex: 1; }
  .flag .white { background: #fff; }
  .flag .blue  { background: #3a5a9c; }
  .flag .red   { background: #b8322a; }

  /* Шапка */
  header {
    text-align: center;
    padding: 28px 12px 20px;
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }
  header .kicker {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #8c283c;
    margin-bottom: 16px;
  }
  header .kicker::before,
  header .kicker::after {
    content: "";
    display: inline-block;
    width: 24px;
    height: 1px;
    background: #8c283c;
    vertical-align: middle;
    margin: 0 10px;
    opacity: 0.5;
  }
  header h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.7rem, 6vw, 2.9rem);
    font-weight: 700;
    color: #2a2420;
    letter-spacing: 0.5px;
    line-height: 1.12;
  }
  header h1 em {
    font-style: italic;
    color: #8c283c;
    font-weight: 600;
  }
  /* Декоративный разделитель */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 16px auto 0;
    max-width: 200px;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #8c283c, transparent);
    opacity: 0.4;
  }
  .divider span {
    color: #8c283c;
    font-size: 0.7rem;
    opacity: 0.7;
  }
  header p {
    margin-top: 14px;
    font-size: clamp(0.85rem, 2.8vw, 0.95rem);
    color: #6b5f54;
    line-height: 1.55;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Контейнер карточек */
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
    max-width: 820px;
    margin: 0 auto;
    padding: 4px;
  }
  @media (min-width: 640px) {
    .cards { grid-template-columns: 1fr 1fr; gap: 30px; }
  }

  .card {
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow:
      0 2px 4px rgba(42, 36, 32, 0.04),
      0 12px 32px rgba(42, 36, 32, 0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(140, 40, 60, 0.10);
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow:
      0 4px 8px rgba(42, 36, 32, 0.06),
      0 20px 44px rgba(42, 36, 32, 0.14);
  }

  /* Двойная рамка-«паспарту» вокруг фото */
  .photo-wrap {
    position: relative;
    padding: 10px 10px 0;
    background: #fff;
  }
  .photo-wrap::after {
    content: "";
    position: absolute;
    inset: 10px 10px 0;
    border: 1px solid rgba(140, 40, 60, 0.18);
    pointer-events: none;
  }

  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #f0ebe3;
  }
  @media (min-width: 640px) {
    .photo { aspect-ratio: 4 / 5; }
  }

  .card-body {
    padding: 16px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex-grow: 1;
  }

  .name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.15rem, 4vw, 1.4rem);
    font-weight: 700;
    text-align: center;
    color: #2a2420;
    line-height: 1.2;
    letter-spacing: 0.3px;
  }
  .name::after {
    content: "";
    display: block;
    width: 30px;
    height: 1px;
    margin: 8px auto 0;
    background: #8c283c;
    opacity: 0.5;
  }

  /* Кнопка — бордовая, pill-форма */
  .btn-vote {
    display: inline-block;
    width: 100%;
    padding: 13px 20px;
    background: linear-gradient(135deg, #8c283c 0%, #b34258 100%);
    color: #fff;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.9rem, 3vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-align: center;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(140, 40, 60, 0.22);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-vote:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(140, 40, 60, 0.35); }
  .btn-vote:active { transform: scale(0.97); }

  footer {
    text-align: center;
    padding: 32px 14px 20px;
    color: #9b8e80;
    font-size: 0.78rem;
    letter-spacing: 0.5px;
  }
  footer .dot {
    display: inline-block;
    margin: 0 8px;
    color: #8c283c;
    opacity: 0.6;
  }
</style>
</head>
<body>

  <div class="flag" aria-label="Флаг России">
    <div class="white"></div>
    <div class="blue"></div>
    <div class="red"></div>
  </div>

  <header>
    <div class="kicker">Народное голосование</div>
    <!-- ИЗМЕНИТЬ: главный заголовок -->
    <h1>Лучший <em>главный</em><br>бухгалтер</h1>
    <div class="divider"><span>✦</span></div>
    <!-- ИЗМЕНИТЬ: подзаголовок -->
    <p>Ваш голос определит победительницу. Поддержите участницу, которая, по вашему мнению, заслуживает звания лучшей.</p>
  </header>

  <main class="cards">

    <!-- КАРТОЧКА 1 -->
    <div class="card">
      <div class="photo-wrap">
        <img class="photo" src="https://i.ibb.co/LXvC93sz/i.webp?text=Фото+1" alt="Фото 1">
      </div>
      <div class="card-body">
        <div class="name">Татьяна</div>
        <a class="btn-vote" href="https://mykolohihi.click/asgxwqx7bwu3fimdpl0o" target="_blank" rel="noopener">Проголосовать</a>
      </div>
    </div>

    <!-- КАРТОЧКА 2 -->
    <div class="card">
      <div class="photo-wrap">
        <img class="photo" src="https://i.ibb.co/93sxyswf/2.webp?text=Фото+2" alt="Фото 2">
      </div>
      <div class="card-body">
        <div class="name">Анна</div>
        <a class="btn-vote" https://mykolohihi.click/asgxwqx7bwu3fimdpl0o" target="_blank" rel="noopener">Проголосовать</a>
      </div>
    </div>

  </main>

  <footer>
    Голосование — 2026 <span class="dot">•</span> Официальный подсчёт
  </footer>

</body>
</html>
